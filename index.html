<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a1f44" />
<title>LASU Math Education Portal — Raph Techs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1f44; --navy-2:#132d5e; --navy-3:#1e3a6f;
  --gold:#c9a84c; --gold-soft:#e8d48b;
  --white:#fff; --bg:#f7f9fc; --card:#fff;
  --line:#e6ebf3; --ink:#1a2438; --muted:#6b7a95;
  --ok:#1e7e4a; --warn:#d4830a; --danger:#c0392b;
  --radius:14px; --radius-sm:9px;
  --shadow:0 4px 24px rgba(10,31,68,.07);
  --shadow-lg:0 14px 44px rgba(10,31,68,.14);
  --sidebar-w:264px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --display:'Playfair Display',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:inherit;text-decoration:none}
::selection{background:var(--gold-soft);color:var(--navy)}

/* ============ SIDEBAR ============ */
.sidebar{
  position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
  color:#fff;z-index:1000;display:flex;flex-direction:column;
  transition:transform .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;
}
.sidebar-brand{padding:26px 22px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand .eyebrow{font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px}
.sidebar-brand h1{font-family:var(--display);font-size:17px;font-weight:700;line-height:1.32}
.sidebar-brand .sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:6px;letter-spacing:.3px}
.nav{padding:16px 12px;flex:1;display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.35);padding:14px 12px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;
  font-size:14px;font-weight:500;color:rgba(255,255,255,.78);
  transition:background .18s,color .18s;position:relative;text-align:left;width:100%;
}
.nav-item .ico{width:18px;height:18px;flex-shrink:0;opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(201,168,76,.18),rgba(201,168,76,.05));color:#fff;font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav-item.active .ico{color:var(--gold)}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.42);letter-spacing:.3px}

/* ============ LAYOUT ============ */
.app{min-height:100vh;display:flex;flex-direction:column}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:500;background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:14px 22px;display:flex;align-items:center;gap:14px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.burger{display:none;width:40px;height:40px;border-radius:10px;background:var(--navy);color:#fff;align-items:center;justify-content:center;flex-shrink:0}
.page-title{font-size:16px;font-weight:700;color:var(--navy);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-user{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--navy);background:var(--white);border:1px solid var(--line);padding:7px 12px;border-radius:100px}
.chip-user .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(30,126,74,.15)}

.content{padding:22px;max-width:1320px;width:100%;margin:0 auto;flex:1}
.page{display:none;animation:fade .35s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ COMPONENTS ============ */
.hero{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-3) 100%);
  color:#fff;border-radius:18px;padding:28px 26px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-lg);margin-bottom:22px;
}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.18),transparent 70%);pointer-events:none}
.hero h2{font-family:var(--display);font-size:clamp(22px,3vw,30px);font-weight:700;line-height:1.25;margin-bottom:6px}
.hero p{font-size:14px;color:rgba(255,255,255,.72);max-width:560px}
.hero .gold{color:var(--gold-soft)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .22s,box-shadow .22s;
}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.stat .ic{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px;
  background:linear-gradient(135deg,rgba(10,31,68,.06),rgba(10,31,68,.02));color:var(--navy);
}
.stat.gold .ic{background:linear-gradient(135deg,rgba(201,168,76,.18),rgba(201,168,76,.06));color:#9a7d2e}
.stat.warn .ic{background:rgba(212,131,10,.12);color:var(--warn)}
.stat.danger .ic{background:rgba(192,57,43,.1);color:var(--danger)}
.stat .num{font-size:28px;font-weight:800;color:var(--navy);line-height:1.1;letter-spacing:-.5px}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px;letter-spacing:.2px}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px;flex-wrap:wrap}
.section-head h3{font-family:var(--display);font-size:19px;font-weight:700;color:var(--navy)}
.section-head .hint{font-size:12px;color:var(--muted)}

.searchbar{
  display:flex;align-items:center;gap:10px;background:var(--white);
  border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;
  transition:border-color .2s,box-shadow .2s;margin-bottom:18px;
}
.searchbar:focus-within{border-color:var(--navy);box-shadow:0 0 0 4px rgba(10,31,68,.06)}
.searchbar input{border:none;outline:none;flex:1;font-size:14.5px;background:transparent;color:var(--ink);min-width:0}
.searchbar input::placeholder{color:#9aa5b8}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filters select{
  border:1.5px solid var(--line);background:var(--white);border-radius:10px;
  padding:9px 13px;font-size:13px;color:var(--ink);font-weight:500;outline:none;
  transition:border-color .18s;
}
.filters select:focus{border-color:var(--navy)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);transition:transform .22s,box-shadow .22s,border-color .22s;
  cursor:pointer;position:relative;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#d5dceb}
.card .row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.card .code{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--gold);background:rgba(201,168,76,.1);padding:3px 9px;border-radius:6px;white-space:nowrap}
.card h4{font-size:15.5px;font-weight:700;color:var(--navy);line-height:1.35;margin-bottom:6px}
.card .meta{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.card .meta b{color:var(--ink);font-weight:600}
.card .units{font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);padding:3px 8px;border-radius:6px;white-space:nowrap}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;letter-spacing:.3px;text-transform:uppercase}
.badge.upcoming{background:rgba(10,31,68,.07);color:var(--navy)}
.badge.soon{background:rgba(212,131,10,.14);color:var(--warn)}
.badge.overdue{background:rgba(192,57,43,.12);color:var(--danger)}
.badge.published{background:rgba(30,126,74,.12);color:var(--ok)}
.badge.draft{background:rgba(107,122,149,.14);color:var(--muted)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{width:52px;height:52px;color:var(--line);margin-bottom:12px}
.empty p{font-size:14px}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;
  transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--navy);color:#fff;box-shadow:0 4px 14px rgba(10,31,68,.22)}
.btn-primary:hover{background:var(--navy-2);box-shadow:0 6px 20px rgba(10,31,68,.3)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#b89540);color:var(--navy);box-shadow:0 4px 14px rgba(201,168,76,.35)}
.btn-gold:hover{box-shadow:0 6px 20px rgba(201,168,76,.45)}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-outline:hover{border-color:var(--navy);color:var(--navy)}
.btn-danger{background:rgba(192,57,43,.1);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important}

/* ============ MODAL ============ */
.modal-back{position:fixed;inset:0;background:rgba(10,31,68,.55);backdrop-filter:blur(6px);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal-back.open{display:flex;animation:fade .25s ease}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .3s cubic-bezier(.34,1.56,.64,1);max-height:92vh;display:flex;flex-direction:column}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.modal-head h3{font-family:var(--display);font-size:19px;color:var(--navy);font-weight:700;line-height:1.3}
.modal-close{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:background .18s,color .18s;flex-shrink:0}
.modal-close:hover{background:var(--bg);color:var(--danger)}
.modal-body{padding:22px;overflow-y:auto}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;flex-shrink:0;background:var(--bg)}

/* ============ FORMS ============ */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--navy);margin-bottom:6px;letter-spacing:.2px}
.field input,.field textarea,.field select{
  width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:11px 13px;font-size:14px;color:var(--ink);background:#fff;outline:none;
  transition:border-color .18s,box-shadow .18s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(10,31,68,.08)}
.field textarea{resize:vertical;min-height:88px}
.field .help{font-size:11.5px;color:var(--muted);margin-top:4px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.field-row{grid-template-columns:1fr}}

/* ============ ALERTS / TOASTS ============ */
.alert{padding:11px 14px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:14px;display:none;align-items:center;gap:8px}
.alert.show{display:flex}
.alert.error{background:rgba(192,57,43,.09);color:var(--danger)}
.alert.ok{background:rgba(30,126,74,.09);color:var(--ok)}

#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:11px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);z-index:3000;transition:transform .35s cubic-bezier(.34,1.56,.64,1);max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#toast.gold{background:linear-gradient(135deg,var(--gold),#b89540);color:var(--navy)}
#toast.err{background:var(--danger)}

/* ============ LOGIN ============ */
.login-wrap{min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:18px;padding:34px 28px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.login-card .crest{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--navy-3));display:grid;place-items:center;margin:0 auto 16px;color:var(--gold);box-shadow:0 8px 24px rgba(10,31,68,.25)}
.login-card h2{font-family:var(--display);font-size:23px;color:var(--navy);text-align:center;font-weight:700;margin-bottom:4px}
.login-card .sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:24px}

/* ============ ADMIN TOOLBAR ============ */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.toolbar .spacer{flex:1}

.tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 16px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;transition:color .18s,border-color .18s;background:none}
.tab.active{color:var(--navy);border-color:var(--gold)}

/* ============ TABLE (admin) ============ */
.table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:13.5px}
.table th{text-align:left;padding:12px 14px;background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
.table td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table .actions{display:flex;gap:6px;justify-content:flex-end}
.table-wrap{overflow-x:auto;border-radius:var(--radius)}

/* ============ FOOTER ============ */
footer{margin-top:auto;padding:22px;text-align:center;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);background:#fff}
footer b{color:var(--navy);font-weight:700}

/* ============ DETAIL LIST ============ */
.detail-list{display:flex;flex-direction:column;gap:0;margin:14px 0}
